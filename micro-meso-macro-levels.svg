<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Micro, meso, and macro levels of family analysis</title>
  <desc id="desc">Three nested circles connect individual interaction at the micro level, families and organizations at the meso level, and social institutions and culture at the macro level.</desc>
  <rect width="1200" height="760" rx="28" fill="#fffef9"/>
  <circle cx="600" cy="390" r="330" fill="#e9eef7" stroke="#315f83" stroke-width="7"/>
  <circle cx="600" cy="420" r="235" fill="#e8f5f2" stroke="#16747b" stroke-width="7"/>
  <circle cx="600" cy="448" r="130" fill="#fff1d2" stroke="#d69427" stroke-width="7"/>
  <text x="600" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#17384a">MACRO</text>
  <text x="600" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#344b55">institutions • laws • economy • culture • inequality</text>
  <text x="600" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="800" fill="#0d5961">MESO</text>
  <text x="600" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#344b55">families • schools • workplaces • communities</text>
  <text x="600" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="800" fill="#7c5314">MICRO</text>
  <text x="600" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#443821">interaction • identity</text>
  <text x="600" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#443821">emotion • meaning</text>
  <g fill="none" stroke="#d96e50" stroke-width="5" stroke-linecap="round"><path d="M530 550 C470 610 420 642 348 654"/><path d="M670 550 C730 610 780 642 852 654"/></g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17384a"><text x="335" y="690" text-anchor="middle">personal experiences</text><text x="865" y="690" text-anchor="middle">social structures</text></g>
  <text x="600" y="732" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5d6a70">Family life connects face-to-face interaction with organizations and society-wide forces.</text>
</svg>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 1080"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Human chromosome pairs and common sex chromosome patterns
  </title>
  <desc id="description">
    Educational infographic showing 22 pairs of autosomes and the highlighted
    23rd pair, followed by comparison cards for 46 XX, 46 XY, 47 XXY, 47 XXX, 47
    XYY, and 45 X.
  </desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop stop-color="#17384a" />
      <stop offset="1" stop-color="#0d5961" />
    </linearGradient>
    <linearGradient id="highlight" x1="0" x2="1">
      <stop stop-color="#fff3d9" />
      <stop offset="1" stop-color="#fce4dc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#17384a"
        flood-opacity=".12"
      />
    </filter>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #17384a;
      }
      .white {
        fill: #fff;
      }
      .title {
        font-size: 42px;
        font-weight: 800;
      }
      .subtitle {
        font-size: 22px;
      }
      .section {
        font-size: 25px;
        font-weight: 800;
      }
      .pairno {
        font-size: 17px;
        font-weight: 800;
        text-anchor: middle;
      }
      .cardtitle {
        font-size: 30px;
        font-weight: 900;
      }
      .cardbody {
        font-size: 18px;
      }
      .badge {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .auto {
        stroke: #247783;
        stroke-width: 13;
        stroke-linecap: round;
      }
      .xchr {
        stroke: #d96e50;
        stroke-width: 15;
        stroke-linecap: round;
      }
      .ychr {
        stroke: #674f82;
        stroke-width: 15;
        stroke-linecap: round;
      }
      .card {
        fill: #fff;
        stroke: #d5e1de;
        stroke-width: 2;
      }
      .accent-f {
        fill: #e8f5f2;
      }
      .accent-m {
        fill: #f2edf7;
      }
      .accent-v {
        fill: #fff7e7;
      }
    </style>
  </defs>
  <rect width="1400" height="1080" rx="34" fill="#f5f8f7" />
  <path
    d="M34 0h1332a34 34 0 0 1 34 34v142H0V34A34 34 0 0 1 34 0Z"
    fill="url(#header)"
  />
  <text x="70" y="72" class="title white">
    Humans usually have 46 chromosomes
  </text>
  <text x="70" y="115" class="subtitle white">
    They are organized into 23 pairs: 22 autosome pairs plus one pair of sex
    chromosomes.
  </text>
  <g transform="translate(70 218)">
    <text y="0" class="section">A karyotype arranges chromosomes by pair</text>
    <text y="32" class="subtitle">
      Pairs 1–22 are autosomes. Pair 23 is highlighted because it commonly
      includes X and/or Y chromosomes.
    </text>
    <rect
      y="60"
      width="1260"
      height="260"
      rx="24"
      fill="#fff"
      filter="url(#shadow)"
    />
    <g transform="translate(40 88)">
      <path
        d="M15 0v64m28-64v64 M111 3v61m28-61v61 M207 6v58m28-58v58 M303 9v55m28-55v55 M399 11v53m28-53v53 M495 13v51m28-51v51 M591 15v49m28-49v49 M687 17v47m28-47v47 M783 19v45m28-45v45 M879 21v43m28-43v43 M975 23v41m28-41v41 M1071 25v39m28-39v39"
        class="auto"
      />
      <g class="pairno">
        <text x="29" y="94">1</text>
        <text x="125" y="94">2</text>
        <text x="221" y="94">3</text>
        <text x="317" y="94">4</text>
        <text x="413" y="94">5</text>
        <text x="509" y="94">6</text>
        <text x="605" y="94">7</text>
        <text x="701" y="94">8</text>
        <text x="797" y="94">9</text>
        <text x="893" y="94">10</text>
        <text x="989" y="94">11</text>
        <text x="1085" y="94">12</text>
      </g>
    </g>
    <g transform="translate(90 218)">
      <path
        d="M15 0v38m28-38v38 M111 2v36m28-36v36 M207 4v34m28-34v34 M303 6v32m28-32v32 M399 8v30m28-30v30 M495 10v28m28-28v28 M591 12v26m28-26v26 M687 14v24m28-24v24 M783 18v20m28-20v20 M879 20v18m28-18v18"
        class="auto"
      />
      <g class="pairno">
        <text x="29" y="68">13</text>
        <text x="125" y="68">14</text>
        <text x="221" y="68">15</text>
        <text x="317" y="68">16</text>
        <text x="413" y="68">17</text>
        <text x="509" y="68">18</text>
        <text x="605" y="68">19</text>
        <text x="701" y="68">20</text>
        <text x="797" y="68">21</text>
        <text x="893" y="68">22</text>
      </g>
      <g transform="translate(960 -8)">
        <rect
          x="-18"
          y="-12"
          width="108"
          height="104"
          rx="18"
          fill="url(#highlight)"
          stroke="#e1a63a"
          stroke-width="3"
        />
        <path d="M15 10v55" class="xchr" />
        <path d="M55 37v28" class="ychr" />
        <text x="35" y="88" class="pairno">23</text>
      </g>
    </g>
  </g>
  <g transform="translate(70 585)">
    <text y="0" class="section">
      The 23rd pair: typical patterns and chromosome-number variations
    </text>
    <g transform="translate(0 28)" filter="url(#shadow)">
      <rect width="400" height="165" rx="22" class="card" />
      <path
        d="M0 22A22 22 0 0 1 22 0h356a22 22 0 0 1 22 22v26H0Z"
        class="accent-f"
      />
      <text x="24" y="35" class="cardtitle">46,XX</text>
      <text x="268" y="33" class="badge">TYPICAL</text>
      <path d="M318 72v58m38-58v58" class="xchr" />
      <text x="24" y="82" class="cardbody">Commonly associated with</text>
      <text x="24" y="108" class="cardbody">female sex development.</text>
      <text x="24" y="139" class="cardbody">46 chromosomes total.</text>
    </g>
    <g transform="translate(430 28)" filter="url(#shadow)">
      <rect width="400" height="165" rx="22" class="card" />
      <path
        d="M0 22A22 22 0 0 1 22 0h356a22 22 0 0 1 22 22v26H0Z"
        class="accent-m"
      />
      <text x="24" y="35" class="cardtitle">46,XY</text>
      <text x="268" y="33" class="badge">TYPICAL</text>
      <path d="M318 72v58" class="xchr" />
      <path d="M356 103v27" class="ychr" />
      <text x="24" y="82" class="cardbody">Commonly associated with</text>
      <text x="24" y="108" class="cardbody">male sex development.</text>
      <text x="24" y="139" class="cardbody">46 chromosomes total.</text>
    </g>
    <g transform="translate(860 28)" filter="url(#shadow)">
      <rect width="400" height="165" rx="22" class="card" />
      <path
        d="M0 22A22 22 0 0 1 22 0h356a22 22 0 0 1 22 22v26H0Z"
        class="accent-v"
      />
      <text x="24" y="35" class="cardtitle">47,XXY</text>
      <text x="270" y="33" class="badge">TRISOMY</text>
      <path d="M302 72v58m32-58v58" class="xchr" />
      <path d="M366 103v27" class="ychr" />
      <text x="24" y="82" class="cardbody">Klinefelter syndrome;</text>
      <text x="24" y="108" class="cardbody">affects male development.</text>
      <text x="24" y="139" class="cardbody">Traits vary widely.</text>
    </g>
    <g transform="translate(0 220)" filter="url(#shadow)">
      <rect width="400" height="165" rx="22" class="card" />
      <path
        d="M0 22A22 22 0 0 1 22 0h356a22 22 0 0 1 22 22v26H0Z"
        class="accent-v"
      />
      <text x="24" y="35" class="cardtitle">47,XXX</text>
      <text x="268" y="33" class="badge">TRISOMY X</text>
      <path d="M292 72v58m34-58v58m34-58v58" class="xchr" />
      <text x="24" y="82" class="cardbody">Trisomy X; affects girls</text>
      <text x="24" y="108" class="cardbody">and women.</text>
      <text x="24" y="139" class="cardbody">
        Features may be mild or absent.
      </text>
    </g>
    <g transform="translate(430 220)" filter="url(#shadow)">
      <rect width="400" height="165" rx="22" class="card" />
      <path
        d="M0 22A22 22 0 0 1 22 0h356a22 22 0 0 1 22 22v26H0Z"
        class="accent-v"
      />
      <text x="24" y="35" class="cardtitle">47,XYY</text>
      <text x="270" y="33" class="badge">TRISOMY</text>
      <path d="M302 72v58" class="xchr" />
      <path d="M334 103v27m32-27v27" class="ychr" />
      <text x="24" y="82" class="cardbody">XYY syndrome; affects males.</text>
      <text x="24" y="108" class="cardbody">Many have few unusual</text>
      <text x="24" y="139" class="cardbody">physical features.</text>
    </g>
    <g transform="translate(860 220)" filter="url(#shadow)">
      <rect width="400" height="165" rx="22" class="card" />
      <path
        d="M0 22A22 22 0 0 1 22 0h356a22 22 0 0 1 22 22v26H0Z"
        class="accent-v"
      />
      <text x="24" y="35" class="cardtitle">45,X</text>
      <text x="250" y="33" class="badge">MONOSOMY X</text>
      <path d="M350 72v58" class="xchr" />
      <text x="24" y="82" class="cardbody">Turner syndrome;</text>
      <text x="24" y="108" class="cardbody">affects female development.</text>
      <text x="24" y="139" class="cardbody">One X is missing or altered.</text>
    </g>
  </g>
  <g transform="translate(70 1012)">
    <rect width="1260" height="48" rx="16" fill="#17384a" />
    <text x="24" y="31" class="cardbody white">
      <tspan font-weight="800">Remember:</tspan>
      a karyotype shows chromosome number and arrangement—not identity,
      personality, worth, exact anatomy, or a person’s future.
    </text>
  </g>
</svg>
